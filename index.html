<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Сімейний вішліст / Семейный вишлист</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    font-family: 'Nunito', sans-serif;
    background: var(--tg-theme-bg-color, #FBF8F0);
    color: var(--tg-theme-text-color, #2B3A3A);
  }
  .serif { font-family: 'Fraunces', serif; }
  .btn { cursor: pointer; border: none; border-radius: 10px; font-weight: 700; font-family: inherit; font-size: 13px; padding: 8px 14px; }
  .btn:active { transform: scale(0.97); }
  .card { border-radius: 12px; padding: 12px 14px; }
  .row { display: flex; align-items: center; }
  input, textarea, select { font-family: inherit; font-size: 14px; border-radius: 8px; border: 1px solid #d8d2c0; padding: 8px 10px; }
  #gate { max-width: 360px; margin: 40px auto; text-align: center; }
  .hidden { display: none !important; }
  .tabbar { display: flex; gap: 8px; border-bottom: 1px solid #EDE6D6; margin-bottom: 14px; }
  .tab { background: transparent; padding: 8px 12px; color: #8A8A82; border-bottom: 2px solid transparent; font-size: 13px; }
  .tab.active { color: #2F4F4F; border-bottom: 2px solid #E3A027; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .jarbar { height: 6px; background: rgba(0,0,0,0.08); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .jarfill { height: 100%; }
  .barrow { display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:6px; }
  .bartrack { flex:1; height:14px; background:#EDE6D6; border-radius:6px; overflow:hidden; }
  .barfill { height:100%; background:#2F4F4F; }
</style>
</head>
<body>

<div id="gate">
  <div class="serif" style="font-size:20px;font-weight:600;margin-bottom:8px;">🎁 Сімейний вішліст</div>
  <p style="font-size:13px;color:#8A8A82;margin-bottom:14px;" id="gateText">
    Введите код семьи — свой личный пароль-комнату. Все, кто введёт тот же код, увидят общий список.
  </p>
  <input id="familyCodeInput" placeholder="например: ivanov-family" style="width:100%;margin-bottom:8px;" />
  <button class="btn" id="joinBtn" style="background:#2F4F4F;color:#fff;width:100%;">Войти в семью</button>
</div>

<div id="app" class="hidden">

  <div class="card" style="background:#2F4F4F;color:#FBF8F0;margin-bottom:14px;">
    <div class="row" style="justify-content:space-between;">
      <div class="row" style="gap:8px;">
        <span style="font-size:22px;">🎁</span>
        <span class="serif" style="font-size:20px;font-weight:600;" id="hTitle">Наш семейный вишлист</span>
      </div>
      <button class="btn" id="langBtn" style="background:rgba(255,255,255,0.12);color:#FBF8F0;">🌐 UA</button>
    </div>
    <p style="font-size:13px;opacity:0.85;margin:6px 0 0;" id="hSub">Добавляйте желания и исполняйте их друг для друга.</p>
    <div id="myProgress" style="margin-top:12px;background:rgba(255,255,255,0.08);border-radius:12px;padding:8px 12px;"></div>
  </div>

  <div id="toast" class="hidden card" style="background:#7FA98A;color:#173404;margin-bottom:12px;font-size:13px;"></div>

  <div class="tabbar">
    <button class="tab active" data-tab="list" id="tabList">🎁 Желания</button>
    <button class="tab" data-tab="rating" id="tabRating">🏆 Рейтинг</button>
    <button class="tab" data-tab="reports" id="tabReports">📅 Отчёты</button>
  </div>

  <div id="viewList">
    <div class="row" style="justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
      <div class="row" style="gap:6px;">
        <button class="btn" id="filterOpen" style="background:#2F4F4F;color:#fff;">Открытые</button>
        <button class="btn" id="filterDone" style="background:#EDE6D6;">Исполненные</button>
      </div>
      <button class="btn" id="addBtn" style="background:#E3A027;color:#412402;">+ Добавить</button>
    </div>

    <div id="addForm" class="card hidden" style="background:#fff;border:1px solid #EDE6D6;margin-bottom:14px;">
      <input id="fTitle" placeholder="Что хочется?" style="width:100%;margin-bottom:8px;" />
      <textarea id="fNote" placeholder="Детали (необязательно)" rows="2" style="width:100%;margin-bottom:8px;"></textarea>
      <div class="row" style="gap:8px;margin-bottom:10px;flex-wrap:wrap;">
        <select id="fCat"></select>
        <select id="fPriority"></select>
      </div>
      <button class="btn" id="saveWishBtn" style="background:#2F4F4F;color:#fff;">Сохранить</button>
    </div>

    <div id="wishGrid" class="grid"></div>
    <div id="emptyMsg" style="text-align:center;color:#8A8A82;font-size:13px;padding:20px 0;"></div>
  </div>

  <div id="viewRating" class="hidden"></div>
  <div id="viewReports" class="hidden"></div>

</div>

<script>
/* ===== НАСТРОЙКА FIREBASE =====
   1. Зайдите на console.firebase.google.com, создайте проект (бесплатно).
   2. Build -> Realtime Database -> Create Database -> начните в тестовом режиме.
   3. Project settings -> ваше веб-приложение -> скопируйте firebaseConfig и вставьте ниже.
*/

  <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyCult4VG8WZ7TWDA-mWaTTpjxSN4IrPuWY",
    authDomain: "realtime-database-1b1c6.firebaseapp.com",
    databaseURL: "https://realtime-database-1b1c6-default-rtdb.firebaseio.com",
    projectId: "realtime-database-1b1c6",
    storageBucket: "realtime-database-1b1c6.firebasestorage.app",
    messagingSenderId: "1078010849386",
    appId: "1:1078010849386:web:5013f8d252b9fb3d58c213",
    measurementId: "G-BC59NY30V3"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);

  
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCult4VG8WZ7TWDA-mWaTTpjxSN4IrPuWY",
  databaseURL: "https://realtime-database-1b1c6-default-rtdb.firebaseio.com",
  projectId: "realtime-database-1b1c6",
};

let db = null;
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
} catch (e) {
  console.warn("Firebase не настроен — данные не будут сохраняться между устройствами.", e);
}

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const tgUser = tg?.initDataUnsafe?.user;
const myName = (tgUser ? (tgUser.first_name + (tgUser.last_name ? " " + tgUser.last_name : "")) : localStorage.getItem("fw_name")) || "";
if (!tgUser && myName) localStorage.setItem("fw_name", myName);

const I18N = {
  ru: {
    hTitle: "Наш семейный вишлист", hSub: "Добавляйте желания и исполняйте их друг для друга — за это дают очки и звания.",
    gateText: "Введите код семьи — свой личный пароль-комнату. Все, кто введёт тот же код, увидят общий список.",
    join: "Войти в семью",
    tabList: "Желания", tabRating: "Рейтинг", tabReports: "Отчёты",
    openFilter: "Открытые", doneFilter: "Исполненные", addWish: "+ Добавить", cancel: "Отмена",
    titlePh: "Что хочется?", notePh: "Детали (необязательно)", saveWish: "Сохранить",
    emptyOpen: "Пока нет открытых желаний.", emptyDone: "Ещё ничего не исполнено.",
    from: "от", grantedBy: n => `исполнил(а) ${n}`, fulfil: "Исполнить",
    ratingTitle: "Звания семьи", ratingEmpty: "Рейтинг появится после первого исполненного желания.",
    pointsRule: "5 / 10 / 20 очков за низкий/средний/высокий приоритет. За чужое желание — в 1.5 раза больше.",
    byMonth: "За месяц", byYear: "За год",
    addedStat: "Добавлено", doneStat: "Исполнено", pointsStat: "Очков",
    noData: "Нет данных за этот период.", perPerson: "По каждому",
    points: "очков", maxLevel: "максимальный уровень!",
    until: (n, l) => `до «${n}» ещё ${l}`,
    toastAdded: "Желание добавлено ✦",
    priorities: { low: "Не срочно", medium: "Хочу", high: "Мечта" },
    categories: { gift: "Подарок", trip: "Путешествие", home: "Для дома", fun: "Впечатление", other: "Другое" },
    levels: ["Новичок", "Помощник семьи", "Герой желаний", "Мастер добрых дел", "Легенда дома"],
    months: ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"],
  },
  uk: {
    hTitle: "Наш сімейний вішліст", hSub: "Додавайте бажання та виконуйте їх одне для одного — за це нараховують бали.",
    gateText: "Введіть код родини — свій пароль-кімнату. Усі, хто введе той самий код, побачать спільний список.",
    join: "Увійти",
    tabList: "Бажання", tabRating: "Рейтинг", tabReports: "Звіти",
    openFilter: "Відкриті", doneFilter: "Виконані", addWish: "+ Додати", cancel: "Скасувати",
    titlePh: "Чого хочеться?", notePh: "Деталі (необов'язково)", saveWish: "Зберегти",
    emptyOpen: "Поки немає відкритих бажань.", emptyDone: "Ще нічого не виконано.",
    from: "від", grantedBy: n => `виконав(ла) ${n}`, fulfil: "Виконати",
    ratingTitle: "Звання родини", ratingEmpty: "Рейтинг зʼявиться після першого виконаного бажання.",
    pointsRule: "5 / 10 / 20 балів за низький/середній/високий пріоритет. За чуже бажання — у 1.5 раза більше.",
    byMonth: "За місяць", byYear: "За рік",
    addedStat: "Додано", doneStat: "Виконано", pointsStat: "Балів",
    noData: "Немає даних за цей період.", perPerson: "По кожному",
    points: "балів", maxLevel: "максимальний рівень!",
    until: (n, l) => `до «${n}» ще ${l}`,
    toastAdded: "Бажання додано ✦",
    priorities: { low: "Не терміново", medium: "Хочу", high: "Мрія" },
    categories: { gift: "Подарунок", trip: "Подорож", home: "Для дому", fun: "Враження", other: "Інше" },
    levels: ["Новачок", "Помічник родини", "Герой бажань", "Майстер добрих справ", "Легенда дому"],
    months: ["січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"],
  }
};
const PRIORITY_META = { low: { points: 5 }, medium: { points: 10 }, high: { points: 20 } };
const CATEGORY_META = [
  { id: "gift", color: "#B4682E", bg: "#F6E7D8" }, { id: "trip", color: "#1E5B54", bg: "#DCEEE9" },
  { id: "home", color: "#8A6A2F", bg: "#F3EAD2" }, { id: "fun", color: "#8B3A3A", bg: "#F5DEDE" },
  { id: "other", color: "#4A4A45", bg: "#E9E7DE" },
];
const LEVEL_THRESHOLDS = [
  { min: 0, color: "#8A8A82" }, { min: 50, color: "#1E5B54" }, { min: 150, color: "#B4682E" },
  { min: 300, color: "#8B3A3A" }, { min: 600, color: "#C79A2E" },
];

let lang = localStorage.getItem("fw_lang") || "ru";
let familyCode = localStorage.getItem("fw_family") || "";
let wishes = {};
let filter = "open";
let curTab = "list";

function t() { return I18N[lang]; }
function catMeta(id) { return CATEGORY_META.find(c => c.id === id) || CATEGORY_META[4]; }

function getLevel(points) {
  let idx = 0;
  LEVEL_THRESHOLDS.forEach((l, i) => { if (points >= l.min) idx = i; });
  const cur = LEVEL_THRESHOLDS[idx];
  const next = LEVEL_THRESHOLDS[idx + 1];
  const progress = next ? Math.min(100, Math.round(((points - cur.min) / (next.min - cur.min)) * 100)) : 100;
  return { name: t().levels[idx], color: cur.color, next: next ? { name: t().levels[idx+1], min: next.min } : null, progress };
}
function wishPoints(w) {
  if (w.status !== "done") return 0;
  const base = PRIORITY_META[w.priority]?.points || 5;
  const granted = w.completedBy && w.completedBy !== w.addedBy;
  return Math.round(base * (granted ? 1.5 : 1));
}
function myTotal() {
  return Object.values(wishes).filter(w => w.completedBy === myName).reduce((s, w) => s + wishPoints(w), 0);
}
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.remove("hidden");
  setTimeout(() => el.classList.add("hidden"), 3000);
}

function joinFamily() {
  const code = document.getElementById("familyCodeInput").value.trim();
  if (!code) return;
  familyCode = code;
  localStorage.setItem("fw_family", code);
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  listenWishes();
}
document.getElementById("joinBtn").onclick = joinFamily;

function listenWishes() {
  if (!db) { render(); return; }
  db.ref("families/" + familyCode + "/wishes").on("value", snap => {
    wishes = snap.val() || {};
    render();
  });
}

async function addWish() {
  const title = document.getElementById("fTitle").value.trim();
  if (!title || !myName) return;
  const w = {
    title, note: document.getElementById("fNote").value.trim(),
    category: document.getElementById("fCat").value,
    priority: document.getElementById("fPriority").value,
    addedBy: myName, addedAt: Date.now(), status: "open", completedBy: null, completedAt: null,
  };
  if (db) await db.ref("families/" + familyCode + "/wishes").push(w);
  else { wishes[Date.now()] = w; render(); }
  document.getElementById("fTitle").value = ""; document.getElementById("fNote").value = "";
  document.getElementById("addForm").classList.add("hidden");
  showToast(t().toastAdded);
}

async function completeWish(id) {
  if (!myName) return;
  const upd = { status: "done", completedBy: myName, completedAt: Date.now() };
  if (db) await db.ref("families/" + familyCode + "/wishes/" + id).update(upd);
  else { Object.assign(wishes[id], upd); render(); }
}
async function deleteWish(id) {
  if (db) await db.ref("families/" + familyCode + "/wishes/" + id).remove();
  else { delete wishes[id]; render(); }
}

function renderCategorySelects() {
  const catSel = document.getElementById("fCat"), prSel = document.getElementById("fPriority");
  catSel.innerHTML = CATEGORY_META.map(c => `<option value="${c.id}">${t().categories[c.id]}</option>`).join("");
  prSel.innerHTML = Object.keys(PRIORITY_META).map(id => `<option value="${id}">${t().priorities[id]} · ${PRIORITY_META[id].points}</option>`).join("");
}

function render() {
  document.getElementById("hTitle").textContent = t().hTitle;
  document.getElementById("hSub").textContent = t().hSub;
  document.getElementById("gateText").textContent = t().gateText;
  document.getElementById("joinBtn").textContent = t().join;
  document.getElementById("tabList").textContent = "🎁 " + t().tabList;
  document.getElementById("tabRating").textContent = "🏆 " + t().tabRating;
  document.getElementById("tabReports").textContent = "📅 " + t().tabReports;
  document.getElementById("filterOpen").textContent = t().openFilter;
  document.getElementById("filterDone").textContent = t().doneFilter;
  document.getElementById("addBtn").textContent = t().addWish;
  document.getElementById("saveWishBtn").textContent = t().saveWish;
  document.getElementById("fTitle").placeholder = t().titlePh;
  document.getElementById("fNote").placeholder = t().notePh;
  renderCategorySelects();

  const myPts = myTotal();
  const myLvl = getLevel(myPts);
  document.getElementById("myProgress").innerHTML = `
    <div style="font-size:13px;opacity:0.9;">${myName || "?"} · <b style="color:#E3A027;">${myLvl.name}</b></div>
    <div style="font-size:12px;opacity:0.7;">${myPts} ${t().points}${myLvl.next ? " · " + t().until(myLvl.next.name, myLvl.next.min - myPts) : " · " + t().maxLevel}</div>
    <div class="jarbar"><div class="jarfill" style="width:${myLvl.progress}%;background:#E3A027;"></div></div>
  `;

  const list = Object.entries(wishes).filter(([, w]) => w.status === filter);
  const grid = document.getElementById("wishGrid");
  const empty = document.getElementById("emptyMsg");
  if (list.length === 0) {
    grid.innerHTML = "";
    empty.textContent = filter === "open" ? t().emptyOpen : t().emptyDone;
  } else {
    empty.textContent = "";
    grid.innerHTML = list.map(([id, w]) => {
      const cat = catMeta(w.category);
      const pts = wishPoints(w);
      return `
      <div class="card" style="background:${cat.bg};">
        <div class="row" style="justify-content:space-between;">
          <span style="font-size:11px;font-weight:700;color:${cat.color};text-transform:uppercase;">${t().categories[w.category]}</span>
          <span style="font-size:11px;color:${cat.color};">${t().priorities[w.priority]}</span>
        </div>
        <div class="serif" style="font-size:16px;font-weight:600;margin:6px 0 2px;">${escapeHtml(w.title)}</div>
        ${w.note ? `<div style="font-size:13px;color:#4A4A45;margin-bottom:6px;">${escapeHtml(w.note)}</div>` : ""}
        <div style="font-size:12px;color:#5F5E5A;">${t().from} ${escapeHtml(w.addedBy)}</div>
        ${w.status === "done"
          ? `<div style="font-size:12px;color:#3B6D11;margin-top:6px;font-weight:700;">✓ ${t().grantedBy(escapeHtml(w.completedBy))} · +${pts}</div>`
          : `<div class="row" style="gap:6px;margin-top:10px;">
               <button class="btn" onclick="completeWish('${id}')" style="background:#7FA98A;color:#173404;">✓ ${t().fulfil}</button>
               <button class="btn" onclick="deleteWish('${id}')" style="background:transparent;color:#993C1D;">🗑</button>
             </div>`}
      </div>`;
    }).join("");
  }

  renderRating();
  renderReports();
}

function renderRating() {
  const map = {};
  Object.values(wishes).forEach(w => {
    if (w.status === "done" && w.completedBy) map[w.completedBy] = (map[w.completedBy] || 0) + wishPoints(w);
    else if (!(w.addedBy in map)) map[w.addedBy] = 0;
  });
  const entries = Object.entries(map).sort((a,b) => b[1]-a[1]);
  const el = document.getElementById("viewRating");
  const medals = ["🥇","🥈","🥉"];
  el.innerHTML = `
    <div class="serif" style="font-size:17px;font-weight:600;margin-bottom:12px;">✦ ${t().ratingTitle}</div>
    ${entries.length === 0 ? `<div style="color:#8A8A82;font-size:13px;">${t().ratingEmpty}</div>` : entries.map(([person, pts], i) => {
      const lvl = getLevel(pts);
      return `<div class="card" style="background:#fff;border:1px solid #EDE6D6;margin-bottom:8px;">
        <div class="row" style="gap:10px;">
          <span style="width:20px;text-align:center;">${medals[i] || "·"}</span>
          <div style="flex:1;">
            <div style="font-weight:700;font-size:14px;">${escapeHtml(person)}</div>
            <div style="font-size:12px;color:${lvl.color};font-weight:700;">${lvl.name}</div>
            <div class="jarbar"><div class="jarfill" style="width:${lvl.progress}%;background:${lvl.color};"></div></div>
          </div>
          <div style="text-align:right;">
            <div style="font-weight:700;">${pts}</div>
            <div style="font-size:11px;color:#8A8A82;">${t().points}</div>
          </div>
        </div>
      </div>`;
    }).join("")}
    <div style="font-size:12px;color:#8A8A82;margin-top:10px;">${t().pointsRule}</div>
  `;
}

let repView = "month";
const now = new Date();
let repMonth = now.getMonth(), repYear = now.getFullYear();

function periodStats(matchFn) {
  const list = Object.values(wishes);
  const added = list.filter(w => matchFn(new Date(w.addedAt)));
  const done = list.filter(w => w.status === "done" && matchFn(new Date(w.completedAt)));
  const totalPoints = done.reduce((s,w) => s + wishPoints(w), 0);
  const perPerson = {};
  added.forEach(w => { perPerson[w.addedBy] = perPerson[w.addedBy] || {added:0,done:0,points:0}; perPerson[w.addedBy].added++; });
  done.forEach(w => { const p = w.completedBy; perPerson[p] = perPerson[p] || {added:0,done:0,points:0}; perPerson[p].done++; perPerson[p].points += wishPoints(w); });
  return { added: added.length, done: done.length, totalPoints, perPerson };
}

function renderReports() {
  const years = new Set([now.getFullYear()]);
  Object.values(wishes).forEach(w => years.add(new Date(w.addedAt).getFullYear()));
  const yearsArr = [...years].sort((a,b) => b-a);
  const stats = repView === "month"
    ? periodStats(d => d.getMonth() === repMonth && d.getFullYear() === repYear)
    : periodStats(d => d.getFullYear() === repYear);

  const maxPts = Math.max(1, ...Object.values(stats.perPerson).map(v => v.points));
  const bars = Object.entries(stats.perPerson).sort((a,b) => b[1].points - a[1].points).map(([p,v]) => `
    <div class="barrow"><span style="width:70px;">${escapeHtml(p)}</span>
      <div class="bartrack"><div class="barfill" style="width:${(v.points/maxPts*100)}%;"></div></div>
      <span style="width:30px;text-align:right;">${v.points}</span>
    </div>`).join("");

  const el = document.getElementById("viewReports");
  el.innerHTML = `
    <div class="row" style="gap:8px;margin-bottom:14px;flex-wrap:wrap;">
      <button class="btn" id="repM" style="background:${repView==='month'?'#2F4F4F':'#EDE6D6'};color:${repView==='month'?'#fff':'#2B3A3A'};">${t().byMonth}</button>
      <button class="btn" id="repY" style="background:${repView==='year'?'#2F4F4F':'#EDE6D6'};color:${repView==='year'?'#fff':'#2B3A3A'};">${t().byYear}</button>
      ${repView==='month' ? `<select id="monthSel">${t().months.map((m,i)=>`<option value="${i}" ${i===repMonth?'selected':''}>${m}</option>`).join("")}</select>` : ""}
      <select id="yearSel">${yearsArr.map(y=>`<option value="${y}" ${y===repYear?'selected':''}>${y}</option>`).join("")}</select>
    </div>
    <div class="row" style="gap:10px;margin-bottom:16px;">
      <div class="card" style="background:#F3EAD2;flex:1;"><div style="font-size:12px;color:#8A6A2F;">${t().addedStat}</div><div class="serif" style="font-size:22px;font-weight:600;">${stats.added}</div></div>
      <div class="card" style="background:#DCEEE9;flex:1;"><div style="font-size:12px;color:#1E5B54;">${t().doneStat}</div><div class="serif" style="font-size:22px;font-weight:600;">${stats.done}</div></div>
      <div class="card" style="background:#F6E7D8;flex:1;"><div style="font-size:12px;color:#B4682E;">${t().pointsStat}</div><div class="serif" style="font-size:22px;font-weight:600;">${stats.totalPoints}</div></div>
    </div>
    <div class="serif" style="font-size:14px;font-weight:600;margin-bottom:8px;">${t().perPerson}</div>
    ${Object.keys(stats.perPerson).length === 0 ? `<div style="color:#8A8A82;font-size:13px;">${t().noData}</div>` : bars}
  `;
  document.getElementById("repM").onclick = () => { repView = "month"; render(); };
  document.getElementById("repY").onclick = () => { repView = "year"; render(); };
  const mSel = document.getElementById("monthSel");
  if (mSel) mSel.onchange = e => { repMonth = Number(e.target.value); render(); };
  document.getElementById("yearSel").onchange = e => { repYear = Number(e.target.value); render(); };
}

function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

document.getElementById("langBtn").onclick = () => {
  lang = lang === "ru" ? "uk" : "ru";
  localStorage.setItem("fw_lang", lang);
  document.getElementById("langBtn").textContent = lang === "ru" ? "🌐 UA" : "🌐 RU";
  render();
};
document.getElementById("addBtn").onclick = () => document.getElementById("addForm").classList.toggle("hidden");
document.getElementById("saveWishBtn").onclick = addWish;
document.getElementById("filterOpen").onclick = () => { filter = "open"; render(); };
document.getElementById("filterDone").onclick = () => { filter = "done"; render(); };
document.querySelectorAll(".tab").forEach(tab => tab.onclick = () => {
  curTab = tab.dataset.tab;
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  tab.classList.add("active");
  document.getElementById("viewList").classList.toggle("hidden", curTab !== "list");
  document.getElementById("viewRating").classList.toggle("hidden", curTab !== "rating");
  document.getElementById("viewReports").classList.toggle("hidden", curTab !== "reports");
});

if (familyCode) {
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  listenWishes();
} else {
  render();
}
</script>
</body>
</html>
